name: RAG System Quick Deploy (PWD)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to PWD via SSH
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: direct.labs.play-with-docker.com
        username: ip172-18-0-18-d2g7qoi91nsg008ttcd0
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          echo "Updating code on PWD..."
          cd ~/ || mkdir -p ~/ && cd ~/
          
          # Remove old code if exists
          rm -rf rag-system
          
          # Clone repo fresh
          git clone https://github.com/SharifDer/rag-system.git
          cd rag-system
          
          # Build Docker image
          docker build -t local-rag:latest .
          
          # Stop old container if running
          if [ $(docker ps -q -f name=local-rag) ]; then
            docker stop local-rag
            docker rm local-rag
          fi
          
          # Run new container
          docker run -d --name local-rag -p 8000:8000 local-rag:latest
          echo "Deployment finished! FastAPI should be running on port 8000."
